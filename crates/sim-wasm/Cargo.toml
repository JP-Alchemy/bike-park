[package]
name = "bike-sim-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for the Bike Park simulation."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bike-sim = { path = "../sim" }
serde_json = "1"
# Must match the wasm-bindgen CLI exactly: cargo install wasm-bindgen-cli --version 0.2.129
wasm-bindgen = "=0.2.129"
